<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>Edzésnapló</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f2f7;color:#111}
.app{max-width:430px;min-height:100vh;margin:auto;padding:25px 18px 40px}
h1{text-align:center;font-size:28px;margin:0 0 8px}
.subtitle{text-align:center;color:#777;margin-bottom:22px}
.button{width:100%;border:0;border-radius:18px;padding:18px;font-size:18px;font-weight:700;background:#111;color:#fff;cursor:pointer;margin-bottom:18px}
.button:active{transform:scale(.98)}
.stats{background:#fff;border-radius:18px;padding:18px;text-align:center;margin-bottom:14px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.stats-number{font-size:34px;font-weight:800}
.stats-text{color:#777;margin-top:3px}
.week-card{background:#fff;border-radius:18px;padding:17px 18px;margin-bottom:20px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.week-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.week-title{font-size:18px;font-weight:750}
.week-count{font-size:22px;font-weight:800}
.progress{height:10px;background:#e8e8ed;border-radius:99px;overflow:hidden;margin:12px 0 8px}
.progress-fill{height:100%;width:0;background:#111;border-radius:99px;transition:width .25s ease}
.week-note{text-align:center;color:#777;font-size:13px}
.calendar{background:#fff;border-radius:20px;padding:18px;box-shadow:0 3px 15px rgba(0,0,0,.06)}
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.month{font-size:20px;font-weight:700}
.nav{border:0;background:#f2f2f7;width:38px;height:38px;border-radius:12px;font-size:20px;cursor:pointer}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekday{text-align:center;color:#999;font-size:12px;font-weight:600;padding-bottom:7px}
.day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;cursor:pointer}
.day:hover{background:#f2f2f7}
.today{border:2px solid #111;font-weight:700}
.trained{background:#111;color:#fff;font-weight:700}
.trained:hover{background:#333}
.empty{cursor:default}
.info{text-align:center;color:#888;font-size:13px;margin-top:20px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
<h1>🏋️ Edzésnapló</h1>
<div class="subtitle">Kövesd, hogy mikor edzettél</div>

<button class="button" id="trainButton">🏋️ EDZETTEM MA</button>

<div class="stats">
  <div class="stats-number" id="monthCount">0</div>
  <div class="stats-text">edzés ebben a hónapban</div>
</div>

<div class="week-card">
  <div class="week-top">
    <div class="week-title">Heti cél</div>
    <div class="week-count" id="weekCount">0 / 5</div>
  </div>
  <div class="progress"><div class="progress-fill" id="progressFill"></div></div>
  <div class="week-note" id="weekNote">Még 5 edzés kell a heti célhoz</div>
</div>

<div class="calendar">
  <div class="calendar-header">
    <button class="nav" id="prevButton" type="button">‹</button>
    <div class="month" id="monthName"></div>
    <button class="nav" id="nextButton" type="button">›</button>
  </div>
  <div class="weekdays">
    <div class="weekday">H</div><div class="weekday">K</div><div class="weekday">Sze</div>
    <div class="weekday">Cs</div><div class="weekday">P</div><div class="weekday">Szo</div><div class="weekday">V</div>
  </div>
  <div class="days" id="calendarDays"></div>
</div>

<div class="info">A napokra kattintva be- vagy kikapcsolhatod az edzést.<br>Az adatok ezen az eszközön kerülnek mentésre.</div>
</div>

<script>
let currentDate = new Date();
let trainedDays = JSON.parse(localStorage.getItem("trainedDays") || "[]");

const months = ["Január","Február","Március","Április","Május","Június","Július","Augusztus","Szeptember","Október","November","December"];

function dateKey(year, month, day){ return `${year}-${month+1}-${day}`; }

function localKey(date){
  return dateKey(date.getFullYear(), date.getMonth(), date.getDate());
}

function startOfWeek(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const day = d.getDay();
  const mondayOffset = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + mondayOffset);
  return d;
}

function getWeekKeys(date){
  const start = startOfWeek(date);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(start);
    d.setDate(start.getDate()+i);
    return localKey(d);
  });
}

function updateWeekStats(){
  const count = getWeekKeys(new Date()).filter(k => trainedDays.includes(k)).length;
  document.getElementById("weekCount").textContent = `${count} / 5`;
  document.getElementById("progressFill").style.width = `${Math.min(count,5)/5*100}%`;
  const note = document.getElementById("weekNote");
  if(count >= 5) note.textContent = "🎉 Megvan az 5 edzés ezen a héten!";
  else {
    const left = 5-count;
    note.textContent = `Még ${left} edzés kell a heti célhoz`;
  }
}

function updateMonthCount(){
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  const count = trainedDays.filter(key => {
    const parts = key.split("-");
    return Number(parts[0]) === year && Number(parts[1]) === month+1;
  }).length;
  document.getElementById("monthCount").textContent = count;
}

function renderCalendar(){
  const year = currentDate.getFullYear(), month = currentDate.getMonth();
  document.getElementById("monthName").textContent = `${months[month]} ${year}`;
  const container = document.getElementById("calendarDays");
  container.innerHTML = "";

  let firstDay = new Date(year,month,1).getDay();
  firstDay = firstDay === 0 ? 6 : firstDay-1;
  const daysInMonth = new Date(year,month+1,0).getDate();
  const today = new Date();

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement("div");
    empty.className = "day empty";
    container.appendChild(empty);
  }

  for(let day=1;day<=daysInMonth;day++){
    const div = document.createElement("div");
    const key = dateKey(year,month,day);
    div.className = "day";
    div.textContent = day;

    if(trainedDays.includes(key)){
      div.classList.add("trained");
      div.textContent = "✓";
    }
    if(day===today.getDate() && month===today.getMonth() && year===today.getFullYear()){
      div.classList.add("today");
    }

    div.addEventListener("click", () => toggleDay(key));
    container.appendChild(div);
  }
  updateMonthCount();
  updateWeekStats();
}

function save(){
  localStorage.setItem("trainedDays", JSON.stringify(trainedDays));
}

function toggleDay(key){
  if(trainedDays.includes(key)) trainedDays = trainedDays.filter(day => day !== key);
  else trainedDays.push(key);
  save();
  renderCalendar();
}

function trainToday(){
  const today = new Date();
  const key = localKey(today);
  if(!trainedDays.includes(key)){
    trainedDays.push(key);
    save();
  }
  currentDate = new Date();
  renderCalendar();
}

document.getElementById("trainButton").addEventListener("click", trainToday);
document.getElementById("prevButton").addEventListener("click", () => {
  currentDate.setMonth(currentDate.getMonth()-1);
  renderCalendar();
});
document.getElementById("nextButton").addEventListener("click", () => {
  currentDate.setMonth(currentDate.getMonth()+1);
  renderCalendar();
});

renderCalendar();
</script>
</body>
</html>
