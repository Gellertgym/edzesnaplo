<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edzésnapló</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2f2f7;
        color: #111;
    }

    .app {
        max-width: 430px;
        min-height: 100vh;
        margin: auto;
        padding: 25px 18px 40px;
    }

    h1 {
        text-align: center;
        font-size: 28px;
        margin-bottom: 8px;
    }

    .subtitle {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    .button {
        width: 100%;
        border: none;
        border-radius: 18px;
        padding: 18px;
        font-size: 18px;
        font-weight: 700;
        background: #111;
        color: white;
        cursor: pointer;
        margin-bottom: 25px;
    }

    .button:active {
        transform: scale(0.98);
    }

    .stats {
        background: white;
        border-radius: 18px;
        padding: 18px;
        text-align: center;
        margin-bottom: 20px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .stats-number {
        font-size: 34px;
        font-weight: 800;
    }

    .stats-text {
        color: #777;
        margin-top: 3px;
    }

    .calendar {
        background: white;
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .calendar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .month {
        font-size: 20px;
        font-weight: 700;
    }

    .nav {
        border: none;
        background: #f2f2f7;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        font-size: 20px;
        cursor: pointer;
    }

    .weekdays,
    .days {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
    }

    .weekday {
        text-align: center;
        color: #999;
        font-size: 12px;
        font-weight: 600;
        padding-bottom: 7px;
    }

    .day {
        aspect-ratio: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        font-size: 14px;
        cursor: pointer;
    }

    .day:hover {
        background: #f2f2f7;
    }

    .today {
        border: 2px solid #111;
        font-weight: 700;
    }

    .trained {
        background: #111;
        color: white;
        font-weight: 700;
    }

    .trained:hover {
        background: #333;
    }

    .empty {
        cursor: default;
    }

    .info {
        text-align: center;
        color: #888;
        font-size: 13px;
        margin-top: 20px;
        line-height: 1.5;
    }
</style>
</head>

<body>

<div class="app">

    <h1>🏋️ Edzésnapló</h1>
    <div class="subtitle">Kövesd, hogy mikor edzettél</div>

    <button class="button" onclick="trainToday()">
        🏋️ EDZETTEM MA
    </button>

    <div class="stats">
        <div class="stats-number" id="monthCount">0</div>
        <div class="stats-text">edzés ebben a hónapban</div>
    </div>

    <div class="calendar">

        <div class="calendar-header">
            <button class="nav" onclick="previousMonth()">‹</button>
            <div class="month" id="monthName"></div>
            <button class="nav" onclick="nextMonth()">›</button>
        </div>

        <div class="weekdays">
            <div class="weekday">H</div>
            <div class="weekday">K</div>
            <div class="weekday">Sze</div>
            <div class="weekday">Cs</div>
            <div class="weekday">P</div>
            <div class="weekday">Szo</div>
            <div class="weekday">V</div>
        </div>

        <div class="days" id="calendarDays"></div>

    </div>

    <div class="info">
        A napokra kattintva is be- vagy kikapcsolhatod<br>
        az edzést. Az adatok ezen az eszközön kerülnek mentésre.
    </div>

</div>

<script>

let currentDate = new Date();

let trainedDays = JSON.parse(
    localStorage.getItem("trainedDays") || "[]"
);

const months = [
    "Január",
    "Február",
    "Március",
    "Április",
    "Május",
    "Június",
    "Július",
    "Augusztus",
    "Szeptember",
    "Október",
    "November",
    "December"
];

function dateKey(year, month, day) {
    return `${year}-${month + 1}-${day}`;
}

function renderCalendar() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("monthName").textContent =
        months[month] + " " + year;

    const container = document.getElementById("calendarDays");
    container.innerHTML = "";

    let firstDay = new Date(year, month, 1).getDay();

    // Vasárnap = 0, ezért hétfővel kezdjük
    firstDay = firstDay === 0 ? 6 : firstDay - 1;

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();

    // Üres mezők a hónap elején
    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        container.appendChild(empty);
    }

    const today = new Date();

    for (let day = 1; day <= daysInMonth; day++) {

        const div = document.createElement("div");
        div.className = "day";
        div.textContent = day;

        const key = dateKey(year, month, day);

        if (trainedDays.includes(key)) {
            div.classList.add("trained");
            div.textContent = "✓";
        }

        if (
            day === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
        ) {
            div.classList.add("today");
        }

        div.onclick = function() {
            toggleDay(key);
        };

        container.appendChild(div);
    }

    updateMonthCount();
}

function toggleDay(key) {

    if (trainedDays.includes(key)) {
        trainedDays = trainedDays.filter(day => day !== key);
    } else {
        trainedDays.push(key);
    }

    localStorage.setItem(
        "trainedDays",
        JSON.stringify(trainedDays)
    );

    renderCalendar();
}

function trainToday() {

    const today = new Date();

    const key = dateKey(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
    );

    if (!trainedDays.includes(key)) {
        trainedDays.push(key);

        localStorage.setItem(
            "trainedDays",
            JSON.stringify(trainedDays)
        );
    }

    currentDate = new Date();

    renderCalendar();
}

function updateMonthCount() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const count = trainedDays.filter(key => {

        const parts = key.split("-");

        return (
            Number(parts[0]) === year &&
            Number(parts[1]) === month + 1
        );

    }).length;

    document.getElementById("monthCount").textContent = count;
}

function previousMonth() {

    currentDate.setMonth(
        currentDate.getMonth() - 1
    );

    renderCalendar();
}

function nextMonth() {

    currentDate.setMonth(
        currentDate.getMonth() + 1
    );

    renderCalendar();
}

renderCalendar();

</script>

</body>
</html>
